<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YT Analyzer Pro</title>
    <meta name="description" content="Analisis channel, playlist, dan video YouTube. Statistik, skor judul & thumbnail, jadwal upload, content gap, export CSV/Excel/PDF, dan download thumbnail massal." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="YT Analyzer Pro" />
    <meta property="og:description" content="Analisis channel YouTube, copy link, dan download thumbnail secara massal." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />

    <!-- Terapkan tema sebelum render agar tidak berkedip -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('yt_dark_mode');
          var dark = saved === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : saved === 'true';
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
