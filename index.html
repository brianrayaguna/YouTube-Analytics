<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>YT Analyzer Pro</title>
    <meta name="description" content="Analisis channel, playlist, dan video YouTube. Statistik, skor judul & thumbnail A–F, peta panas jadwal upload, content gap, benchmark kompetitor, dan ekspor Excel/PDF/HTML/JSON/CSV." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="YT Analyzer Pro — Analitik Channel & Konten YouTube" />
    <meta property="og:description" content="Deteksi video outlier, skor judul & thumbnail A–F, peta panas jadwal upload, content gap, dan ekspor laporan lengkap." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YT Analyzer Pro — Analitik Channel & Konten YouTube" />
    <meta name="twitter:description" content="Deteksi video outlier, skor judul & thumbnail A–F, peta panas jadwal upload, dan ekspor laporan lengkap." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />

    <!-- Terapkan skema warna sebelum render pertama agar tidak berkedip -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('yt_theme_pref');
          if (!pref) {
            var legacy = localStorage.getItem('yt_dark_mode');
            if (legacy === 'true') pref = 'dark';
            else if (legacy === 'false') pref = 'light';
          }
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', pref === 'dark' || pref === 'light' ? pref : 'light dark');
          var isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
